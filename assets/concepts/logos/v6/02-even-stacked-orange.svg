<svg id="dub-sub-hub-v6-even-stacked-orange" xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="stacked-title stacked-description">
  <title id="stacked-title">Dub Sub Hub — Even Stacked Orange</title>
  <desc id="stacked-description">A taller orange gradient pill puts the white relay beside an evenly stepped Dub, Sub, Hub word column without dark colors.</desc>
  <defs>
    <linearGradient id="stacked-orange-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8744"/>
      <stop offset="52%" stop-color="#FF5C35"/>
      <stop offset="100%" stop-color="#EF4530"/>
    </linearGradient>
  </defs>
  <rect id="stacked-orange-field" x="20" y="20" width="680" height="520" rx="85" fill="url(#stacked-orange-gradient)"/>
  <rect id="stacked-relay-badge" x="60" y="160" width="250" height="250" rx="55" fill="#D94B27" stroke="#FFFFFF" stroke-width="4"/>
  <g id="stacked-relay-mark" transform="translate(82 179) scale(1.3)">
    <path id="stacked-audio-bubble" d="M34 16h61c12 0 21 9 21 21v44c0 12-9 21-21 21H62l-21 16v-16h-7c-12 0-21-9-21-21V37c0-12 9-21 21-21Z" fill="#FFFFFF"/>
    <path id="stacked-audio-bars" d="M44 56v11m13-20v29m13-38v47m13-34v22" fill="none" stroke="#D94B27" stroke-width="7" stroke-linecap="round"/>
    <path id="stacked-caption-bubble" d="M80 59h46c12 0 21 9 21 21v37c0 12-9 21-21 21h-7v16l-21-16H80c-12 0-21-9-21-21V80c0-12 9-21 21-21Z" fill="#D94B27" stroke="#FFFFFF" stroke-width="4"/>
    <path id="stacked-caption-lines" d="M80 92h47m-47 17h36" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  </g>
  <rect id="stacked-hub-tile" x="365" y="360" width="300" height="120" rx="34" fill="#FFFFFF"/>
  <g id="stacked-even-wordmark" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="105" font-weight="800" letter-spacing="-6">
    <text id="stacked-dub-word" x="390" y="186" textLength="230" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">Dub</text>
    <text id="stacked-sub-word" x="390" y="320" textLength="230" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">Sub</text>
    <text id="stacked-hub-word" x="390" y="454" textLength="230" lengthAdjust="spacingAndGlyphs" fill="#EE4C2C">Hub</text>
  </g>
</svg>
