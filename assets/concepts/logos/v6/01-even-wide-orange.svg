<svg id="dub-sub-hub-v6-even-wide-orange" xmlns="http://www.w3.org/2000/svg" width="1240" height="340" viewBox="0 0 1240 340" role="img" aria-labelledby="wide-title wide-description">
  <title id="wide-title">Dub Sub Hub — Even Wide Orange</title>
  <desc id="wide-description">An orange gradient pill holds a white dialogue relay and equally spaced Dub, Sub, and Hub words using orange and white only.</desc>
  <defs>
    <linearGradient id="wide-orange-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8744"/>
      <stop offset="52%" stop-color="#FF5C35"/>
      <stop offset="100%" stop-color="#EF4530"/>
    </linearGradient>
  </defs>
  <rect id="wide-orange-field" x="20" y="20" width="1200" height="300" rx="60" fill="url(#wide-orange-gradient)"/>
  <rect id="wide-relay-badge" x="50" y="65" width="210" height="210" rx="46" fill="#D94B27" stroke="#FFFFFF" stroke-width="4"/>
  <g id="wide-relay-mark" transform="translate(70 82) scale(1.13)">
    <path id="wide-audio-bubble" d="M34 16h61c12 0 21 9 21 21v44c0 12-9 21-21 21H62l-21 16v-16h-7c-12 0-21-9-21-21V37c0-12 9-21 21-21Z" fill="#FFFFFF"/>
    <path id="wide-audio-bars" d="M44 56v11m13-20v29m13-38v47m13-34v22" fill="none" stroke="#D94B27" stroke-width="7" stroke-linecap="round"/>
    <path id="wide-caption-bubble" d="M80 59h46c12 0 21 9 21 21v37c0 12-9 21-21 21h-7v16l-21-16H80c-12 0-21-9-21-21V80c0-12 9-21 21-21Z" fill="#D94B27" stroke="#FFFFFF" stroke-width="4"/>
    <path id="wide-caption-lines" d="M80 92h47m-47 17h36" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  </g>
  <rect id="wide-hub-tile" x="865" y="72" width="255" height="205" rx="42" fill="#FFFFFF"/>
  <g id="wide-even-wordmark" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="132" font-weight="800" letter-spacing="-7">
    <text id="wide-dub-word" x="330" y="217" textLength="205" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">Dub</text>
    <text id="wide-sub-word" x="610" y="217" textLength="205" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">Sub</text>
    <text id="wide-hub-word" x="890" y="217" textLength="205" lengthAdjust="spacingAndGlyphs" fill="#EE4C2C">Hub</text>
  </g>
</svg>
