<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Dub Sub Hub — orange field</title>
  <desc id="logo-description">Dub in white, Sub in black, and Hub in orange inside a white rounded tile, all on a soft orange background.</desc>
  <rect id="orange-field" width="1200" height="340" rx="60" fill="#E98D52" />
  <text id="dub-word" x="205" y="220" fill="#FFFFFF" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="154" font-weight="800" letter-spacing="-9" text-anchor="middle">Dub</text>
  <text id="sub-word" x="535" y="220" fill="#171512" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="154" font-weight="800" letter-spacing="-9" text-anchor="middle">Sub</text>
  <rect id="hub-tile" x="735" y="55" width="405" height="230" rx="42" fill="#FFFCF8" />
  <text id="hub-word" x="937" y="220" fill="#E9793C" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="154" font-weight="800" letter-spacing="-9" text-anchor="middle">Hub</text>
</svg>
