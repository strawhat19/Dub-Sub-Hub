<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="370" viewBox="0 0 1360 370" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Dub Sub Hub — horizontal caption mark</title>
  <desc id="logo-description">An orange play button sits to the left of a one-line Dub Sub Hub wordmark, with two caption lines beneath the words.</desc>

  <defs>
    <linearGradient id="cream-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9F3" />
      <stop offset="1" stop-color="#FFEDE1" />
    </linearGradient>
    <linearGradient id="orange-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA158" />
      <stop offset="0.55" stop-color="#FF773C" />
      <stop offset="1" stop-color="#FF6136" />
    </linearGradient>
    <filter id="play-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#A9411F" flood-opacity="0.17" />
    </filter>
    <filter id="hub-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#B45A34" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect id="cream-field" width="1360" height="370" rx="52" fill="url(#cream-gradient)" />
  <rect id="play-tile" x="52" y="71" width="206" height="188" rx="48" fill="url(#orange-gradient)" filter="url(#play-shadow)" />
  <path id="play-symbol" d="M119 112c0-7 8-11 14-7l82 50c6 4 6 12 0 16l-82 50c-6 4-14 0-14-7V112Z" fill="#FFFFFF" />

  <text id="dub-word" x="306" y="220" fill="url(#orange-gradient)" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="134" font-weight="800" letter-spacing="-8">Dub</text>
  <text id="sub-word" x="595" y="220" fill="#211711" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="134" font-weight="800" letter-spacing="-8">Sub</text>
  <rect id="hub-tile" x="894" y="82" width="410" height="168" rx="38" fill="#FFFFFF" stroke="#FFD6BE" stroke-width="2" filter="url(#hub-shadow)" />
  <text id="hub-word" x="1099" y="218" fill="#F05A30" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="134" font-weight="800" letter-spacing="-8" text-anchor="middle">Hub</text>

  <rect id="caption-line-one" x="307" y="284" width="945" height="14" rx="7" fill="#211711" />
  <rect id="caption-line-two" x="307" y="315" width="620" height="14" rx="7" fill="#211711" />
</svg>
