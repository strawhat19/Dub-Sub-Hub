<svg id="dub-sub-hub-v5-stacked-relay-pill" xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="stacked-relay-title stacked-relay-description">
  <title id="stacked-relay-title">Dub Sub Hub — stacked relay pill</title>
  <desc id="stacked-relay-description">A tall dialogue relay badge sits beside a two-row Dub Sub Hub wordmark on the original orange gradient. The white Hub tile has no shadow.</desc>
  <defs>
    <linearGradient id="stacked-relay-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8744" />
      <stop offset="52%" stop-color="#FF5C35" />
      <stop offset="100%" stop-color="#EF4530" />
    </linearGradient>
  </defs>
  <rect id="stacked-relay-field" x="20" y="20" width="1080" height="460" rx="90" fill="url(#stacked-relay-gradient)" />
  <rect id="stacked-relay-badge" x="62" y="104" width="286" height="286" rx="62" fill="#211711" />
  <g id="stacked-relay-mark" transform="translate(89 139) scale(1.46)">
    <path id="stacked-relay-audio-bubble" d="M34 16h61c12 0 21 9 21 21v44c0 12-9 21-21 21H62l-21 16v-16h-7c-12 0-21-9-21-21V37c0-12 9-21 21-21Z" fill="#FFFFFF" />
    <path id="stacked-relay-audio-bars" d="M44 56v11m13-20v29m13-38v47m13-34v22" fill="none" stroke="#211711" stroke-width="7" stroke-linecap="round" />
    <path id="stacked-relay-caption-bubble" d="M80 59h46c12 0 21 9 21 21v37c0 12-9 21-21 21h-7v16l-21-16H80c-12 0-21-9-21-21V80c0-12 9-21 21-21Z" fill="#211711" stroke="#FFFFFF" stroke-width="4" />
    <path id="stacked-relay-caption-lines" d="M80 92h47m-47 17h36" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  </g>
  <g id="stacked-relay-wordmark" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="116" font-weight="800" letter-spacing="-7" text-anchor="middle">
    <text id="stacked-relay-dub-word" x="528" y="204" fill="#FFFFFF">Dub</text>
    <text id="stacked-relay-sub-word" x="859" y="204" fill="#1C1715">Sub</text>
  </g>
  <rect id="stacked-relay-hub-tile" x="406" y="242" width="632" height="172" rx="36" fill="#FFFCF8" />
  <text id="stacked-relay-hub-word" x="722" y="369" fill="#EE4C2C" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="140" font-weight="800" letter-spacing="-9" text-anchor="middle">Hub</text>
</svg>
