<svg id="dub-sub-hub-v5-orange-relay-wordmark" xmlns="http://www.w3.org/2000/svg" width="1520" height="380" viewBox="0 0 1520 380" role="img" aria-labelledby="orange-relay-title orange-relay-description">
  <title id="orange-relay-title">Dub Sub Hub — orange relay wordmark</title>
  <desc id="orange-relay-description">A white dialogue relay sits on a brown badge at the left of the orange gradient Dub Sub Hub pill. Hub rests in a flat white tile without a shadow.</desc>
  <defs>
    <linearGradient id="orange-relay-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8744" />
      <stop offset="52%" stop-color="#FF5C35" />
      <stop offset="100%" stop-color="#EF4530" />
    </linearGradient>
  </defs>
  <rect id="orange-relay-field" x="20" y="20" width="1480" height="340" rx="60" fill="url(#orange-relay-gradient)" />
  <rect id="orange-relay-badge" x="54" y="72" width="236" height="236" rx="48" fill="#211711" />
  <g id="orange-relay-mark" transform="translate(68 87) scale(1.18)">
    <path id="orange-relay-audio-bubble" d="M34 16h61c12 0 21 9 21 21v44c0 12-9 21-21 21H62l-21 16v-16h-7c-12 0-21-9-21-21V37c0-12 9-21 21-21Z" fill="#FFFFFF" />
    <path id="orange-relay-audio-bars" d="M44 56v11m13-20v29m13-38v47m13-34v22" fill="none" stroke="#211711" stroke-width="7" stroke-linecap="round" />
    <path id="orange-relay-caption-bubble" d="M80 59h46c12 0 21 9 21 21v37c0 12-9 21-21 21h-7v16l-21-16H80c-12 0-21-9-21-21V80c0-12 9-21 21-21Z" fill="#211711" stroke="#FFFFFF" stroke-width="4" />
    <path id="orange-relay-caption-lines" d="M80 92h47m-47 17h36" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  </g>
  <g id="orange-relay-wordmark" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="154" font-weight="800" letter-spacing="-9" text-anchor="middle">
    <text id="orange-relay-dub-word" x="448" y="240" fill="#FFFFFF">Dub</text>
    <text id="orange-relay-sub-word" x="735" y="240" fill="#1C1715">Sub</text>
  </g>
  <rect id="orange-relay-hub-tile" x="915" y="75" width="550" height="230" rx="42" fill="#FFFCF8" />
  <text id="orange-relay-hub-word" x="1190" y="240" fill="#EE4C2C" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="154" font-weight="800" letter-spacing="-9" text-anchor="middle">Hub</text>
</svg>
