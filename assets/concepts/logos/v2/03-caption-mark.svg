<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Dub Sub Hub — caption mark</title>
  <desc id="logo-description">A vivid orange play and caption bubble beside a bold Dub Sub wordmark and an orange Hub on a white tile.</desc>

  <defs>
    <linearGradient id="cream-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9F3" />
      <stop offset="1" stop-color="#FFEBDD" />
    </linearGradient>
    <linearGradient id="orange-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9C45" />
      <stop offset="0.55" stop-color="#FF6F32" />
      <stop offset="1" stop-color="#FF5C35" />
    </linearGradient>
    <filter id="bubble-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#A9411F" flood-opacity="0.16" />
    </filter>
    <filter id="tile-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#B45A34" flood-opacity="0.11" />
    </filter>
  </defs>

  <rect id="cream-field" width="1280" height="420" rx="56" fill="url(#cream-gradient)" />
  <path id="caption-bubble" d="M130 48h172c46 0 84 38 84 84v146c0 46-38 84-84 84H181l-69 40v-43c-38-8-66-41-66-81V132c0-46 38-84 84-84Z" fill="url(#orange-gradient)" filter="url(#bubble-shadow)" />
  <path id="play-symbol" d="M153 112c0-8 9-13 16-9l103 62c7 4 7 14 0 18l-103 62c-7 4-16-1-16-9V112Z" fill="#FFFFFF" />
  <rect id="caption-line-one" x="130" y="270" width="188" height="17" rx="8.5" fill="#211711" />
  <rect id="caption-line-two" x="130" y="304" width="135" height="17" rx="8.5" fill="#211711" />

  <text id="dub-word" x="430" y="190" fill="url(#orange-gradient)" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="134" font-weight="800" letter-spacing="-8">Dub</text>
  <text id="sub-word" x="762" y="190" fill="#211711" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="134" font-weight="800" letter-spacing="-8">Sub</text>
  <rect id="hub-tile" x="426" y="228" width="398" height="143" rx="31" fill="#FFFFFF" stroke="#FFD6BE" stroke-width="2" filter="url(#tile-shadow)" />
  <text id="hub-word" x="625" y="338" fill="#FF5C35" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="119" font-weight="800" letter-spacing="-7" text-anchor="middle">Hub</text>
</svg>
